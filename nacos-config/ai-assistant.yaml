spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 8000

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.7
  max-tokens: 1024
  timeout: 30s

ai-assistant:
  chat:
    memory-ttl-hours: 2
    tool-result-limit: 5